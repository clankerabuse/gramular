<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gramular</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Gramular</h1>
    </header>

    <section class="settings">
      <p class="hint">
        Type in any text field on a page and a Gramular bubble appears beside it.
        Click it to improve grammar/spelling/clarity (or run a custom edit). Supports Claude and Grok.
      </p>

      <label class="field-label" for="provider">Provider</label>
      <select id="provider" class="select-input">
        <option value="anthropic">Claude (Anthropic)</option>
        <option value="xai">Grok (xAI)</option>
      </select>

      <div id="anthropicKeyGroup">
        <label class="field-label" for="apiKey">Anthropic API Key</label>
        <input
          id="apiKey"
          class="text-input"
          type="password"
          placeholder="sk-ant-..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div id="xaiKeyGroup" style="display: none;">
        <label class="field-label" for="xaiApiKey">xAI API Key</label>
        <input
          id="xaiApiKey"
          class="text-input"
          type="password"
          placeholder="xai-..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <label class="field-label" for="modelSelect">Model</label>
      <select id="modelSelect" class="select-input"></select>

      <label class="checkbox-row">
        <input id="enabledToggle" type="checkbox" checked />
        <span>Show the inline bubble while typing</span>
      </label>

      <button id="saveSettings" class="btn">Save</button>
      <p id="settingsStatus" class="status"></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
